name: genzcinema
description: GenzCinema Hotel mobile app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client
  dio: ^5.4.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Secure Storage (replaces HttpSession for JWT)
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.2.0

  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2

  # WebSocket / Chat realtime
  stomp_dart_client: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
#  assets:
#    - assets/images/
